name: Tag latest
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump, auto derives it from the labels of the PRs merged since the last release"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry_run:
        description: "Compute the next version without tagging or releasing"
        type: boolean
        default: false

concurrency:
  group: tag-latest
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read

    outputs:
      previous: ${{ steps.next-version.outputs.previous }}
      version: ${{ steps.next-version.outputs.version }}
      reason: ${{ steps.next-version.outputs.reason }}
      unlabeled: ${{ steps.next-version.outputs.unlabeled }}
      tag: ${{ steps.push-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Compute next version
        id: next-version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: ./scripts/next-version.sh HEAD "$BUMP" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          PREVIOUS: ${{ steps.next-version.outputs.previous }}
          VERSION: ${{ steps.next-version.outputs.version }}
          BUMP: ${{ steps.next-version.outputs.bump }}
          REASON: ${{ steps.next-version.outputs.reason }}
          UNLABELED: ${{ steps.next-version.outputs.unlabeled }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY
          - Previous: $PREVIOUS
          - Version: ${VERSION:-none, nothing changed}
          - Bump: $BUMP
          - Reason: $REASON
          - Unlabeled PRs counted as patch: ${UNLABELED:-none}
          SUMMARY

      - name: Create and push tag
        id: push-tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          if [[ "$DRY_RUN" == "true" || -z "$VERSION" ]]; then
            echo "Not tagging (dry run: $DRY_RUN, version: ${VERSION:-none})"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Post nothing to release to Slack
        if: steps.next-version.outputs.version == ''
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ secrets.ALERTS_SLACK_CHANNEL_ID }}"
            text: "web-sdk: nothing changed on master since ${{ steps.next-version.outputs.previous }}, no tag created"

  release:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      # A tag pushed with GITHUB_TOKEN does not trigger release.yml's push event, but a dispatch does.
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

      - name: Post to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ secrets.ALERTS_SLACK_CHANNEL_ID }}"
            text: "web-sdk ${{ needs.tag.outputs.tag }} tagged: ${{ needs.tag.outputs.reason }}\n${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml${{ needs.tag.outputs.unlabeled && format('\nUnlabeled PRs counted as patch: {0}', needs.tag.outputs.unlabeled) || '' }}"

  slack-notification:
    needs: [tag, release]
    runs-on: ubuntu-22.04
    if: ${{ failure() }}
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ secrets.ALERTS_SLACK_CHANNEL_ID }}"
            text: ":crybot: Tag latest web-sdk: Failure\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
