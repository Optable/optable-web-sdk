name: Tag latest
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump, auto derives it from the labels of the PRs merged since the last release"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry_run:
        description: "Compute the next version without tagging or releasing"
        type: boolean
        default: false

concurrency:
  group: tag-latest
  cancel-in-progress: false

env:
  # #team-hummingbird
  SLACK_CHANNEL_ID: C09GWKJ8VL6

jobs:
  tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Refuse to tag from anything but master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Tag latest only runs on master, got $REF."
          exit 1

      # A tag pushed with GITHUB_TOKEN would not start release.yml, a tag pushed with an App token does.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.GH_ACTION_REPO_WRITE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_REPO_WRITE_APP_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Compute next version
        id: next-version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: ./scripts/next-version.sh HEAD "$BUMP" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          PREVIOUS: ${{ steps.next-version.outputs.previous }}
          VERSION: ${{ steps.next-version.outputs.version }}
          BUMP: ${{ steps.next-version.outputs.bump }}
          REASON: ${{ steps.next-version.outputs.reason }}
          UNLABELED: ${{ steps.next-version.outputs.unlabeled }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY
          - Previous: $PREVIOUS
          - Version: ${VERSION:-none, nothing changed}
          - Bump: $BUMP
          - Reason: $REASON
          - Unlabeled PRs counted as patch: ${UNLABELED:-none}
          SUMMARY

      - name: Create and push tag
        id: push-tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.next-version.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_ID: ${{ vars.GH_ACTION_REPO_WRITE_APP_ID }}
        run: |
          if [[ "$DRY_RUN" == "true" || -z "$VERSION" ]]; then
            echo "Not tagging (dry run: $DRY_RUN, version: ${VERSION:-none})"
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Post tag to Slack
        if: steps.push-tag.outputs.tag != ''
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ env.SLACK_CHANNEL_ID }}"
            text: "web-sdk ${{ steps.push-tag.outputs.tag }} tagged: ${{ steps.next-version.outputs.reason }}\n${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml${{ steps.next-version.outputs.unlabeled && format('\nUnlabeled PRs counted as patch: {0}', steps.next-version.outputs.unlabeled) || '' }}"

      - name: Post nothing to release to Slack
        if: steps.next-version.outputs.version == ''
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ env.SLACK_CHANNEL_ID }}"
            text: "web-sdk: nothing changed on master since ${{ steps.next-version.outputs.previous }}, no tag created"

  slack-notification:
    needs: [tag]
    runs-on: ubuntu-22.04
    if: ${{ failure() }}
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ env.SLACK_CHANNEL_ID }}"
            text: ":crybot: Tag latest web-sdk: Failure\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
