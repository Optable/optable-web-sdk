name: Release new version of Optable SDK and demos
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  # Called by tag.yml after it pushes a tag. A tag pushed with GITHUB_TOKEN does
  # not start another workflow run, so the push trigger above will not fire for
  # that tag and the release has to be invoked directly.
  workflow_call:
    inputs:
      version:
        description: "Tag to release, e.g. v1.2.3"
        required: true
        type: string

env:
  workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
  service-account: ${{ secrets.SERVICE_ACCOUNT }}

jobs:
  # On a tag push the version is the tag that triggered the run. When tag.yml
  # calls this workflow the run is still on master, so github.ref_name is the
  # branch and the version has to come from the caller instead.
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$REF_NAME}"
          echo "Releasing ${version}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  tests-prettier:
    uses: ./.github/workflows/reusable-lint-test.yml

  build:
    needs: [tests-prettier, version]
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}

  # This job needs to run before deploying to npm otherwise `latest` won't be updated
  define-gcs-versions-to-update:
    needs: [build, version]
    runs-on: ubuntu-22.04

    outputs:
      sdk-versions: ${{ steps.sdk-versions.outputs.versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      # We need to determine which versions to update based on the new version
      # - In case of a pre-release, only update vX.Y.Z-{prerel}
      # - If not a pre-release
      #   - Always update vX.Y.Z
      #   - Always update vX.Y
      #   - Update latest if the new release version is greater than current
      #   - Update vX if patching a version for which the minor is the latest, examples:
      #     - v.12.2.1 and patching v.12.1.4, we don't update v12
      #     - v.12.2.1 and patching v.12.2.2, we update v12
      - name: Determine versions to update
        id: sdk-versions
        env:
          REF_NAME: ${{ needs.version.outputs.version }}
        run: ./scripts/versions-to-update.sh @optable/web-sdk "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Show versions that will be updated
        env:
          SDK_VERSIONS: ${{ steps.sdk-versions.outputs.versions }}
        run: |
          echo "SDK versions: $SDK_VERSIONS"

  deploy-sdk-to-npm:
    needs: [build, define-gcs-versions-to-update, version]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download web artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: browser/dist

      - name: Download lib artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-lib
          path: lib/dist

      # Step will fail if the version is invalid, the resolved version is the tag name (v.*.*.*)
      - name: Patch version
        env:
          REF_NAME: ${{ needs.version.outputs.version }}
        run: ./scripts/patch-version.sh "$REF_NAME"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Configure Node.js for npm registry with OIDC
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM using OIDC
        run: pnpm publish --provenance --access public --no-git-checks

  deploy-sdk-to-gcs:
    needs: [deploy-sdk-to-npm, define-gcs-versions-to-update, version]
    strategy:
      matrix:
        sdk-version: ${{ fromJSON(needs.define-gcs-versions-to-update.outputs.sdk-versions) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download web artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: browser/dist

      - name: Auth to google cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.workload_identity_provider }}
          service_account: ${{ env.service-account }}

      - name: Upload SDK to GCS bucket, upload new version
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: "browser/dist/sdk.js"
          destination: "optable-web-sdk/${{ matrix.sdk-version }}"
          process_gcloudignore: false
          headers: |
            x-goog-meta-optable-sdk-version: ${{ needs.version.outputs.version }}

  deploy-demo:
    needs: [deploy-sdk-to-npm, version]
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get sdk artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: browser/dist

      - name: Get vanilla-demo artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-demo-vanilla
          path: demos

      - name: Get react-demo artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-react-demo
          path: demos/react/dist

      - name: Get npm-demo artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-npm-demo
          path: demos/npm/dist

      - uses: "google-github-actions/auth@v3"
        id: auth
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ env.workload_identity_provider }}
          service_account: ${{ env.service-account }}

      - name: Build web-sdk-demos Docker Image
        env:
          REF_NAME: ${{ needs.version.outputs.version }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -t "us-docker.pkg.dev/optable-artifact-registry/optable/optable-web-sdk-demos:$REF_NAME" \
            ./demos

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Publish web-sdk-demos to us-docker.pkg.dev
        env:
          REF_NAME: ${{ needs.version.outputs.version }}
        run: docker push "us-docker.pkg.dev/optable-artifact-registry/optable/optable-web-sdk-demos:$REF_NAME"

  slack-notification:
    needs:
      [version, tests-prettier, build, deploy-sdk-to-npm, define-gcs-versions-to-update, deploy-sdk-to-gcs, deploy-demo]
    runs-on: ubuntu-22.04
    if: ${{ failure() }}
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_MESSENGER_APP_TOKEN }}"
          payload: |
            channel: "${{ secrets.ALERTS_SLACK_CHANNEL_ID }}"
            text: "Release Optable-web-sdk: Failure\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":crybot: Release Optable-web-sdk"
                  emoji: true
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Status:*\nFailure"
                  - type: "mrkdwn"
                    text: "*Version:*\n${{ needs.version.outputs.version }}"
                  - type: "mrkdwn"
                    text: "*Author:*\n${{ github.actor || github.triggering_actor }}"
                  - type: "mrkdwn"
                    text: ":x: *Workflow run:*\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  - type: "mrkdwn"
                    text: "*Mentions:*\n@here"
